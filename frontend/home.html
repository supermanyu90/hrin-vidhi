<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>ऋण विधि · Hrin Vidhi — आपका कर्ज़, आपके अधिकार</title>
<meta name="description" content="अपनी भाषा में बोलिए। जानिए आपके कर्ज़ की असली कीमत और आपके अधिकार। मुफ़्त।">
<meta name="theme-color" content="#101A3D">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Yatra One: a Devanagari face drawn after hand-painted Indian shop signage.
     Baloo 2: heavy, rounded, covers Devanagari + Latin. Two faces only —
     webfont weight is a real cost on the connections this audience has. -->
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;800&family=Yatra+One&display=swap" rel="stylesheet">

<style>
  :root {
    /* Ledger ink, marigold, vermilion. Indigo is the blue of carbon-copy loan
       paper; marigold is the ₹200 note and the flowers on every doorway. */
    --ink:        #101A3D;
    --ink-2:      #1B2856;
    --ink-3:      #2A3872;
    --paper:      #F7F3E8;
    --paper-dim:  #DED8C8;
    --marigold:   #FFB000;
    --marigold-d: #E09400;
    --vermilion:  #E8432F;
    --mint:       #35C880;

    --display: 'Yatra One', 'Baloo 2', system-ui, sans-serif;
    --ui: 'Baloo 2', 'Noto Sans Devanagari', system-ui, -apple-system, sans-serif;

    /* The shirorekha: the head-line Devanagari letters hang from. Every band
       on this page hangs from one. */
    --rule: 5px solid var(--ink);
    --rule-light: 5px solid var(--paper);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } }

  body {
    font-family: var(--ui);
    background: var(--paper);
    color: var(--ink);
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    overflow-x: hidden;
  }

  .band { padding: 0 20px; }
  .wrap { max-width: 1040px; margin: 0 auto; }

  /* ── Band 1 · the hook ────────────────────────────────────────────── */
  .hero {
    background: var(--ink);
    color: var(--paper);
    padding-top: calc(14px + env(safe-area-inset-top, 0px));
    padding-bottom: 40px;
    position: relative;
    overflow: hidden;
  }
  /* Faint ledger ruling, like the loan paper itself. */
  .hero::before {
    content: ""; position: absolute; inset: 0;
    background: repeating-linear-gradient(
      to bottom, transparent 0 43px, rgba(247,243,232,.045) 43px 44px);
    pointer-events: none;
  }
  .hero > * { position: relative; }

  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 14px; padding-bottom: 18px;
  }
  .mark { font-family: var(--display); font-size: 30px; line-height: 1; color: var(--marigold); }
  .mark small {
    display: block; font-family: var(--ui); font-weight: 600;
    font-size: 11px; letter-spacing: .16em; color: var(--paper-dim);
    text-transform: uppercase; margin-top: 5px;
  }
  .free-pill {
    font-weight: 800; font-size: 13px; white-space: nowrap;
    background: var(--marigold); color: var(--ink);
    padding: 7px 14px; border-radius: 999px;
  }

  /* Language choice is the first decision on the page, not a dropdown. */
  .lang-label {
    font-size: 15px; color: var(--paper-dim); margin-bottom: 10px; font-weight: 600;
  }
  /* Six languages in an even 3x2 on a phone. Left to wrap freely they land
     3/2/1, which strands one language on its own row and pushes the
     microphone further down the screen. */
  .langs {
    display: grid; grid-template-columns: repeat(3, 1fr);
    gap: 9px; margin-bottom: 28px;
  }
  @media (min-width: 560px) {
    .langs { display: flex; flex-wrap: wrap; }
    .lang { padding: 11px 20px; }
  }
  .lang {
    font-family: var(--ui); font-weight: 800; font-size: 19px;
    padding: 11px 14px; border-radius: 14px; cursor: pointer;
    min-height: 52px;
    background: transparent; color: var(--paper);
    border: 2.5px solid var(--ink-3);
    transition: transform .12s, background .16s, border-color .16s;
  }
  .lang:hover { border-color: var(--marigold); }
  .lang[aria-pressed="true"] {
    background: var(--marigold); color: var(--ink); border-color: var(--marigold);
  }
  .lang:active { transform: scale(.96); }

  .headline {
    font-family: var(--ui); font-weight: 800;
    font-size: clamp(31px, 8.2vw, 62px); line-height: 1.12;
    letter-spacing: -.5px; margin-bottom: 14px; max-width: 16ch;
  }
  .headline em { font-style: normal; color: var(--marigold); }
  .sub {
    font-size: clamp(16px, 4vw, 21px); color: var(--paper-dim);
    max-width: 34ch; margin-bottom: 30px; font-weight: 600;
  }

  /* ── The mic: the one thing to press ──────────────────────────────── */
  .cta-row { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
  /* Sized against the button, not the page: she introduces the action rather
     than competing with the headline above it. */
  .sherni-hero { width: 104px; flex: 0 0 104px; }
  /* The hero band is --ink, so her outline flips to paper or she vanishes
     into it. Features stay dark: they sit on her marigold coat, not on the
     band. */
  /* She does not speak on this page, at any width.
     Her bubble is positioned relative to her, and she sits in a row that
     wraps: above her is the subtitle, below her the button, and the bubble
     landed on one or the other depending on where the row broke. Chasing a
     breakpoint was treating the symptom.
     It was redundant anyway — the line repeated the subtitle immediately
     above it, in smaller type, and she is aria-hidden here because she is
     decoration on this page. She speaks in the app, where what she says
     tracks real state and is worth the room. */
  .sherni-hero .sh-say { display: none; }
  .sherni-hero .sherni-svg {
    --sh-line: var(--paper); --sh-ink: #101A3D;
    --sh-mane: var(--marigold); --sh-coat: var(--paper-dim);
  }
  @media (max-width: 520px) {
    .sherni-hero { width: 78px; flex-basis: 78px; }
    /* She introduces the button, so she stays on its row rather than being
       pushed onto a line of her own with the speech bubble stranded above. */
    .cta-row { gap: 12px; }
    .mic-cta { flex: 1 1 auto; justify-content: center; }
    /* The reassurance reads as a caption under the button, not a column
       beside it, once there is no room for two columns. */
    .reassure { flex: 1 1 100%; }

    .sherni-hero { width: 64px; flex-basis: 64px; }
  }

  /* Footer and inline links were 22px tall. Under a thumb that is a miss,
     not a tap. Width-based as well as pointer-based: a phone is the common
     case here, and `pointer: coarse` does not fire in every test harness. */
  @media (pointer: coarse), (max-width: 620px) {
    .foot-links a, a.see-math, #seeMath { padding: 11px 0; display: inline-block; }
    .foot-links { gap: 10px 18px; }
  }
  .mic-cta {
    display: inline-flex; align-items: center; gap: 18px;
    background: var(--marigold); color: var(--ink);
    border: none; border-radius: 999px; cursor: pointer;
    padding: 12px 30px 12px 12px; text-decoration: none;
    font-family: var(--ui); font-weight: 800; font-size: clamp(19px, 5vw, 25px);
    box-shadow: 0 6px 0 var(--marigold-d);
    transition: transform .12s, box-shadow .12s;
  }
  .mic-cta:hover { transform: translateY(-2px); box-shadow: 0 8px 0 var(--marigold-d); }
  .mic-cta:active { transform: translateY(4px); box-shadow: 0 2px 0 var(--marigold-d); }
  .mic-ring {
    width: 62px; height: 62px; border-radius: 50%; flex-shrink: 0;
    background: var(--ink); color: var(--marigold);
    display: grid; place-items: center; font-size: 29px;
  }
  .mic-ring span { animation: thump 2.4s ease-in-out infinite; }
  @keyframes thump { 0%,72%,100% { transform: scale(1); } 80% { transform: scale(1.16); } }
  @media (prefers-reduced-motion: reduce) { .mic-ring span { animation: none; } }

  .reassure { font-size: 15px; color: var(--paper-dim); font-weight: 600; }
  .reassure b { color: var(--paper); }

  /* ── Band 2 · the live proof ──────────────────────────────────────── */
  .proof { background: var(--paper); border-top: var(--rule-light); padding: 34px 20px 42px; }
  .proof-eyebrow {
    font-weight: 800; font-size: 13px; letter-spacing: .14em;
    text-transform: uppercase; color: var(--ink-3); margin-bottom: 6px;
  }
  .proof-title {
    font-weight: 800; font-size: clamp(22px, 5.4vw, 34px);
    line-height: 1.2; margin-bottom: 22px; max-width: 22ch;
  }

  .ledger {
    border: 4px solid var(--ink); border-radius: 18px; overflow: hidden;
    background: #fff;
  }
  .ledger-head {
    background: var(--ink); color: var(--paper);
    padding: 12px 18px; font-weight: 800; font-size: 16px;
    display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .ledger-head span { color: var(--paper-dim); font-weight: 600; }
  .compare { display: grid; grid-template-columns: 1fr; }
  @media (min-width: 620px) { .compare { grid-template-columns: 1fr 1fr; } }
  .cell { padding: 24px 18px; }
  .cell + .cell { border-top: 3px solid var(--paper-dim); }
  @media (min-width: 620px) {
    .cell + .cell { border-top: none; border-left: 3px solid var(--paper-dim); }
  }
  .cell-label { font-weight: 800; font-size: 15px; color: var(--ink-3); margin-bottom: 2px; }
  .cell-num {
    font-family: var(--display); font-size: clamp(50px, 14vw, 82px);
    line-height: 1; letter-spacing: -1px;
  }
  .cell.told .cell-num { color: var(--ink); }
  .cell.real .cell-num { color: var(--vermilion); }
  .cell-note { font-weight: 600; font-size: 14.5px; color: var(--ink-3); margin-top: 6px; }

  .gap-strip {
    background: var(--vermilion); color: #fff;
    padding: 16px 18px; display: flex; align-items: baseline;
    gap: 12px; flex-wrap: wrap; font-weight: 800;
  }
  .gap-strip .amount { font-family: var(--display); font-size: clamp(26px, 7vw, 40px); line-height: 1; }
  .gap-strip .what { font-size: 15.5px; font-weight: 600; }

  .proof-foot {
    margin-top: 14px; font-size: 14px; color: var(--ink-3); font-weight: 600;
  }
  .proof-foot a { color: var(--ink); }

  /* ── Band 3 · what it does ────────────────────────────────────────── */
  .does { background: var(--ink); color: var(--paper); border-top: var(--rule); padding: 36px 20px 44px; }
  .does-title {
    font-weight: 800; font-size: clamp(22px, 5.4vw, 34px); margin-bottom: 24px;
  }
  .tiles { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
  @media (min-width: 760px) { .tiles { grid-template-columns: repeat(4, 1fr); } }
  .tile {
    background: var(--ink-2); border-radius: 18px; padding: 20px 16px 18px;
    border: 2.5px solid var(--ink-3);
  }
  .tile-ico {
    font-size: 38px; line-height: 1; display: block; margin-bottom: 12px;
  }
  .tile-h { font-weight: 800; font-size: 19px; margin-bottom: 5px; }
  .tile-p { font-size: 14.5px; color: var(--paper-dim); font-weight: 600; line-height: 1.45; }

  /* ── Band 4 · the three things they cannot do ─────────────────────── */
  .rights { background: var(--paper); border-top: var(--rule-light); padding: 36px 20px 40px; }
  .rights-title { font-weight: 800; font-size: clamp(22px, 5.4vw, 34px); margin-bottom: 6px; }
  .rights-sub { font-weight: 600; font-size: 16px; color: var(--ink-3); margin-bottom: 22px; }
  .no-list { list-style: none; display: grid; gap: 12px; }
  .no-item {
    display: flex; gap: 15px; align-items: flex-start;
    background: #fff; border: 3px solid var(--ink); border-radius: 16px; padding: 16px 18px;
  }
  .no-mark {
    flex-shrink: 0; width: 34px; height: 34px; border-radius: 50%;
    background: var(--vermilion); color: #fff;
    display: grid; place-items: center; font-weight: 800; font-size: 20px;
  }
  .no-text { font-weight: 800; font-size: clamp(16px, 4.2vw, 20px); line-height: 1.35; }
  .no-text small {
    display: block; font-weight: 600; font-size: 13.5px;
    color: var(--ink-3); margin-top: 4px;
  }

  /* ── Band 5 · close ───────────────────────────────────────────────── */
  .close { background: var(--marigold); color: var(--ink); border-top: var(--rule); padding: 40px 20px 46px; text-align: center; }
  .close h2 { font-weight: 800; font-size: clamp(25px, 6.4vw, 40px); line-height: 1.15; margin-bottom: 10px; }
  .close p { font-weight: 600; font-size: 16.5px; margin-bottom: 24px; }
  .close .mic-cta { background: var(--ink); color: var(--marigold); box-shadow: 0 6px 0 #05091c; }
  .close .mic-cta:hover { box-shadow: 0 8px 0 #05091c; }
  .close .mic-cta:active { box-shadow: 0 2px 0 #05091c; }
  .close .mic-ring { background: var(--marigold); color: var(--ink); }

  footer {
    background: var(--ink); color: var(--paper-dim); border-top: var(--rule-light);
    padding: 26px 20px calc(30px + env(safe-area-inset-bottom, 0px));
    font-size: 13.5px; line-height: 1.65; font-weight: 600;
  }
  footer a { color: var(--marigold); }
  .disclaimer-box {
    border: 2.5px solid var(--ink-3); border-radius: 12px;
    padding: 13px 15px; margin-bottom: 16px; color: var(--paper);
  }
  .foot-links { display: flex; gap: 18px; flex-wrap: wrap; }

  :focus-visible { outline: 4px solid var(--marigold); outline-offset: 3px; border-radius: 4px; }
  .close :focus-visible, .hero :focus-visible { outline-color: var(--paper); }

  /* Entrance: one orchestrated reveal, not scattered effects. */
  .rise { opacity: 0; transform: translateY(14px); animation: rise .55s cubic-bezier(.2,.7,.3,1) forwards; }
  @keyframes rise { to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) {
    .rise { opacity: 1; transform: none; animation: none; }
  }
</style>
</head>
<body>

<!-- ══ Band 1 ══════════════════════════════════════════════════════ -->
<header class="hero band">
  <div class="wrap">
    <div class="topbar rise">
      <div class="mark">ऋण विधि<small>Hrin Vidhi</small></div>
      <div class="free-pill" data-t="free">पूरी तरह मुफ़्त</div>
    </div>

    <div class="rise" style="animation-delay:.05s">
      <div class="lang-label" data-t="pick">अपनी भाषा चुनिए</div>
      <div class="langs" id="langs" role="group" aria-label="भाषा चुनिए"></div>
    </div>

    <h1 class="headline rise" id="headline" style="animation-delay:.1s"></h1>
    <p class="sub rise" id="sub" style="animation-delay:.15s"></p>

    <div class="cta-row rise" style="animation-delay:.2s">
      <div class="sherni-hero" id="sherniHero" aria-hidden="true"></div>
      <a class="mic-cta" id="ctaTop" href="/app">
        <span class="mic-ring" aria-hidden="true"><span>🎤</span></span>
        <span data-t="cta">बोलकर शुरू कीजिए</span>
      </a>
      <p class="reassure" id="reassure"></p>
    </div>
  </div>
</header>

<!-- ══ Band 2 · live proof ═════════════════════════════════════════ -->
<section class="proof band">
  <div class="wrap">
    <div class="proof-eyebrow" data-t="realCase">एक सच्चा उदाहरण</div>
    <h2 class="proof-title" id="proofTitle"></h2>

    <div class="ledger">
      <div class="ledger-head">
        <strong id="ledgerLoan">₹80,000 — दुचाकी का कर्ज़</strong>
        <span id="ledgerTerm">24 महीने</span>
      </div>
      <div class="compare">
        <div class="cell told">
          <div class="cell-label" data-t="theySaid">उन्होंने कहा</div>
          <div class="cell-num">12%</div>
          <div class="cell-note" data-t="onPaper">कागज़ पर यही लिखा था</div>
        </div>
        <div class="cell real">
          <div class="cell-label" data-t="youPay">आप दे रहे हैं</div>
          <div class="cell-num" id="realRate">—</div>
          <div class="cell-note" data-t="afterAll">फ़ीस और तरीक़ा जोड़ने के बाद</div>
        </div>
      </div>
      <div class="gap-strip">
        <span class="amount" id="gapAmount">—</span>
        <span class="what" data-t="extra">इतना ज़्यादा — बिना बताए</span>
      </div>
    </div>

    <p class="proof-foot">
      <span id="proofFoot"></span>
      <a href="/visualizer" id="seeMath"></a>
    </p>
  </div>
</section>

<!-- ══ Band 3 · what it does ═══════════════════════════════════════ -->
<section class="does band">
  <div class="wrap">
    <h2 class="does-title" id="doesTitle"></h2>
    <div class="tiles" id="tiles"></div>
  </div>
</section>

<!-- ══ Band 4 · what they cannot do ════════════════════════════════ -->
<section class="rights band">
  <div class="wrap">
    <h2 class="rights-title" id="rightsTitle"></h2>
    <p class="rights-sub" id="rightsSub"></p>
    <ul class="no-list" id="noList"></ul>
  </div>
</section>

<!-- ══ Band 5 · close ══════════════════════════════════════════════ -->
<section class="close band">
  <div class="wrap">
    <h2 id="closeTitle"></h2>
    <p id="closeSub"></p>
    <a class="mic-cta" id="ctaBottom" href="/app">
      <span class="mic-ring" aria-hidden="true"><span>🎤</span></span>
      <span data-t="cta">बोलकर शुरू कीजिए</span>
    </a>
  </div>
</section>

<footer class="band">
  <div class="wrap">
    <div class="disclaimer-box" id="disclaimerBox"></div>
    <div class="foot-links">
      <a href="/app" data-t="openApp">सहायक खोलें</a>
      <a href="/visualizer" data-t="calc">कर्ज़ का हिसाब</a>
      <a href="/health">Status</a>
    </div>
  </div>
</footer>

<script src="/static/i18n.js?v={{ASSET_VERSION}}"></script>
<script src="/static/mascot.js?v={{ASSET_VERSION}}"></script>
<script>
"use strict";

/* The landing page's job is one thing: get him to press the microphone.
   Everything here serves that, and the hero proof is a LIVE figure from
   /calc/debt-trap rather than a claim typed into the markup. */

const HOME = {
  hi: {
    free: 'पूरी तरह मुफ़्त', pick: 'अपनी भाषा चुनिए',
    headline: 'आपका कर्ज़ असल में <em>कितने का</em> है?',
    sub: 'बोलिए, कागज़ की फ़ोटो भेजिए। हम आपकी भाषा में बताएँगे।',
    cta: 'बोलकर शुरू कीजिए',
    reassure: '<b>वकील नहीं चाहिए.</b> पढ़ना नहीं आता तो भी चलेगा.',
    realCase: 'एक सच्चा उदाहरण',
    proofTitle: 'रमेश को कहा गया था बारह प्रतिशत। असल में वो इतना दे रहे थे:',
    loan: '₹80,000 — दुचाकी का कर्ज़', term: '24 महीने',
    theySaid: 'उन्होंने कहा', youPay: 'आप दे रहे हैं',
    onPaper: 'कागज़ पर यही लिखा था', afterAll: 'फ़ीस और तरीक़ा जोड़ने के बाद',
    extra: 'इतना ज़्यादा — बिना बताए',
    proofFoot: 'यह गिनती अभी, इसी वक़्त की गई है। ',
    seeMath: 'पूरा हिसाब देखिए →',
    doesTitle: 'यह आपके लिए क्या करेगा',
    tiles: [
      ['🎤', 'आप बोलिए', 'अपनी भाषा में. पढ़ना-लिखना ज़रूरी नहीं.'],
      ['📄', 'कागज़ दिखाइए', 'कर्ज़ का कागज़ या नोटिस की फ़ोटो भेजिए.'],
      ['🔊', 'सुनिए', 'आपके अधिकार, आवाज़ में, आपकी भाषा में.'],
      ['✉️', 'चिट्ठी लीजिए', 'शिकायत की तैयार चिट्ठी. भेज दीजिए.'],
    ],
    rightsTitle: 'ये काम वो नहीं कर सकते',
    rightsSub: 'चाहे आपने कितना भी पैसा देना हो।',
    no: [

/* Ramesh's figures. The rate and gap below are placeholders only — they are
   replaced by the real values from /calc/debt-trap as soon as it answers, so
   the page cannot quote a number the backend would not produce. */
const CASE = { principal: 80000, quoted_rate: 12, tenure_months: 24,
               rate_type: 'flat', processing_fee: 3200, other_fees_total: 2150 };

const $ = id => document.getElementById(id);

function esc(s) {
  return String(s).replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function inr(n) {
  const abs = Math.abs(Math.round(n));
  return '₹' + abs.toLocaleString('en-IN');
}

function paint() {
  const c = HOME[lang];
  document.documentElement.lang = lang;

  document.querySelectorAll('[data-t]').forEach(el => {
    const v = c[el.dataset.t];
    if (v) el.textContent = v;
  });

  $('headline').innerHTML = c.headline;
  $('sub').textContent = c.sub;
  $('reassure').innerHTML = c.reassure;
  $('proofTitle').textContent = c.proofTitle;
  $('ledgerLoan').textContent = c.loan;
  $('ledgerTerm').textContent = c.term;
  $('proofFoot').textContent = c.proofFoot;
  $('seeMath').textContent = c.seeMath;
  $('doesTitle').textContent = c.doesTitle;
  $('rightsTitle').textContent = c.rightsTitle;
  $('rightsSub').textContent = c.rightsSub;
  $('closeTitle').textContent = c.closeTitle;
  $('closeSub').textContent = c.closeSub;

  $('tiles').innerHTML = c.tiles.map(([ico, h, p]) => `
    <div class="tile">
      <span class="tile-ico" aria-hidden="true">${ico}</span>
      <div class="tile-h">${esc(h)}</div>
      <div class="tile-p">${esc(p)}</div>
    </div>`).join('');

  $('noList').innerHTML = c.no.map(([h, p]) => `
    <li class="no-item">
      <span class="no-mark" aria-hidden="true">✕</span>
      <span class="no-text">${esc(h)}<small>${esc(p)}</small></span>
    </li>`).join('');

  // The §9 disclaimer, in the borrower's language, from the shared phrasebook —
  // the same words the app speaks and the letter carries.
  $('disclaimerBox').textContent = (typeof DISCLAIMER !== 'undefined')
    ? (DISCLAIMER[lang] || DISCLAIMER.en) : '';

  // Carry the choice into the app so he never picks a language twice.
  const q = '?lang=' + encodeURIComponent(lang);
  $('ctaTop').href = '/app' + q;
  $('ctaBottom').href = '/app' + q;
  document.querySelector('.foot-links a[data-t="openApp"]').href = '/app' + q;

  [...$('langs').children].forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.lang === lang)));

  // Nothing to say here: see the .sherni-hero .sh-say note in the styles.
  // The headline, the subtitle and the button already make the invitation.
}

let heroMascot = null;

function buildLangs() {
  $('langs').innerHTML = LANGUAGES.map(l =>
    `<button class="lang" type="button" data-lang="${l.code}"
             aria-pressed="${l.code === lang}">${esc(l.name)}</button>`).join('');
  $('langs').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    lang = b.dataset.lang;
    try { localStorage.setItem('hv-lang', lang); } catch (err) { /* private mode */ }
    paint();
  });
}

/* Count the real rate up from the quoted one. The reveal IS the product:
   the number he was told becoming the number he actually pays. */
function animateTo(el, from, to, suffix, ms) {
  const reduced = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  if (reduced || ms === 0) { el.textContent = to.toFixed(2) + suffix; return; }
  const t0 = performance.now();
  (function step(now) {
    const p = Math.min(1, (now - t0) / ms);
    const eased = 1 - Math.pow(1 - p, 3);
    el.textContent = (from + (to - from) * eased).toFixed(2) + suffix;
    if (p < 1) requestAnimationFrame(step);
  })(t0);
}

async function loadRealFigures() {
  try {
    const r = await fetch('/calc/debt-trap', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(CASE),
    });
    if (!r.ok) return;
    const a = await r.json();

    /* Show the true figures the moment they arrive. The reveal animation is
       a flourish layered on top — if the observer never fires (the band is
       never scrolled to, or IO is unsupported) the page is still showing the
       right numbers rather than a placeholder that reads as real. */
    $('realRate').textContent = a.all_in_apr.toFixed(2) + '%';
    $('gapAmount').textContent = inr(a.hidden_cost_gap);

    const proof = document.querySelector('.proof');
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver(entries => {
        if (!entries.some(e => e.isIntersecting)) return;
        io.disconnect();
        animateTo($('realRate'), a.quoted_rate, a.all_in_apr, '%', 1100);
      }, { threshold: 0.35 });
      io.observe(proof);
    }
  } catch (err) {
    // The page still reads correctly without the live figure; it simply keeps
    // showing the quoted rate rather than inventing the real one.
  }
}

(function init() {
  try {
    const saved = localStorage.getItem('hv-lang');
    if (saved && HOME[saved]) lang = saved;
  } catch (err) { /* private mode */ }
  const url = new URLSearchParams(location.search).get('lang');
  if (url && HOME[url]) lang = url;

  buildLangs();

  // 'cheer' rather than the chat's calmer 'waiting': this is the one screen
  // whose whole job is to get a frightened person to press the button.
  heroMascot = createMascot($('sherniHero'), { state: 'cheer' });

  paint();
  loadRealFigures();
})();
</script>
